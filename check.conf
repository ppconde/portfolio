# Sourced by ./check. Changing a budget here is a decision for a human reviewer, not an agent.

TEST_CMD="pnpm run check"   # types, biome, build, wrangler dry run. No test runner yet.
LINT_CMD=""      # optional, e.g. "npm run lint"
HOLDOUT_CMD=""   # optional, runs the human-written tests in holdout/, e.g. "pytest -q holdout"

MAX_LOC=1600     # total lines the codebase may hold (1456 when installed).
MAX_DIFF=400     # lines one branch may add over main.

# Git pathspecs left out of both budgets. Add your test dir if tests should not count.
EXCLUDE=(':!specs' ':!holdout' ':!*.md' ':!*lock*'
  ':!graphify-out' ':!.agents' ':!.claude' ':!worker-configuration.d.ts') # generated or tooling
